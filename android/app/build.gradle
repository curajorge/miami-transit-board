plugins {
    id "com.android.application"
}

android {
    namespace "com.jcm.miamitrolleylive"
    compileSdk 35

    defaultConfig {
        applicationId "com.jcm.miamitrolleylive"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/webAssets"))
}

dependencies {}

tasks.register("prepareWebAssets", Sync) {
    from("../..") {
        include "index.html", "styles.css", "engine.js", "app.js", "go.js", "go.css", "bus-stops.js", "trolley-stops.js", "vendor/**"
    }
    into(layout.buildDirectory.dir("generated/webAssets/web"))
}

tasks.named("preBuild").configure { dependsOn("prepareWebAssets") }
